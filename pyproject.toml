[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workjig"
version = "0.2.1"
description = "Run headless LLM coding harnesses as subprocess workers from Python workflows"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Repository = "https://github.com/zby/workjig"
Changelog = "https://github.com/zby/workjig/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: direct function and file-based tests without worker subprocesses",
    "subprocess: integration tests using deterministic local worker processes",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
